<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Plasta</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/blob-yellow.png">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Filtro SVG: bordes temblorosos / dibujados a mano -->
    <svg class="svg-filters" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="squiggly" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise"
                              baseFrequency="0.045"
                              numOctaves="4"
                              seed="3"
                              result="noise"/>
                <feDisplacementMap in="SourceGraphic" in2="noise"
                                   scale="5"
                                   xChannelSelector="R"
                                   yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <!-- Tooltip que sigue al cursor -->
    <div id="cursor-tooltip">
        <div class="tooltip-bubble">
            <img id="tooltip-img" src="" alt="" aria-hidden="true">
            <span id="tooltip-text"></span>
        </div>
    </div>

    <!-- ── Header ── -->
    <header class="site-nav">
        <div class="d-flex align-items-center gap-3">
            <a href="/" class="site-name">La Plasta</a>
        </div>
    </header>

    <!-- ── Blobs / botones ── -->
    <main class="blobs-stage">

        <!-- Contenedor que se ajusta al ancho real de los 3 blobs -->
        <div class="blobs-desktop d-flex align-items-end" style="gap: 8rem;">

            <!-- Azul -->
            <a href="teatros.html" class="blob blob--blue" data-label="Teatros" data-tooltip-img="images/TeatrosC.png">
                <img src="images/blob-blue.png" alt="Teatros">
            </a>

            <!-- Rojo -->
            <a href="visitas.html" class="blob blob--red" data-label="Visitas" data-tooltip-img="images/VisitasC.png">
                <img src="images/blob-red.png" alt="Visitas">
            </a>

            <!-- Columna: amarillo encima del borde izquierdo del blanco -->
            <div class="d-flex flex-column">
                <a href="quienes.html" class="blob blob--yellow align-self-start" style="margin-bottom: 3rem;" data-label="Quiénes somos" data-tooltip-img="images/QuienesSomosC.png">
                    <img src="images/blob-yellow.png" alt="Quiénes somos">
                </a>
                <a href="talleres.html" class="blob blob--white" data-label="Talleres" data-tooltip-img="images/TalleresC.png">
                    <img src="images/blob-white.png" alt="Talleres">
                </a>
            </div>

        </div>

        <!-- Vista móvil: cada pelota en su fila con el texto encima -->
        <div class="blobs-mobile">
            <a href="teatros.html" class="blob-row">
                <span class="blob-row__label">Teatros</span>
                <img class="blob-row__img" src="images/blob-blue.png" alt="Teatros">
            </a>
            <a href="visitas.html" class="blob-row">
                <span class="blob-row__label">Visitas</span>
                <img class="blob-row__img" src="images/blob-red.png" alt="Visitas">
            </a>
            <a href="quienes.html" class="blob-row">
                <span class="blob-row__label">Quiénes somos</span>
                <img class="blob-row__img" src="images/blob-yellow.png" alt="Quiénes somos">
            </a>
            <a href="talleres.html" class="blob-row">
                <span class="blob-row__label">Talleres</span>
                <img class="blob-row__img" src="images/blob-white.png" alt="Talleres">
            </a>
        </div>

    </main>

    <!-- ── Footer ── -->
    <footer class="site-footer">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-auto">
                    <a href="mailto:info@colectivolaplasta.org">info@colectivolaplasta.org</a>
                    <span class="footer-sep">|</span>
                    <a href="contacto.html">Contacto</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const tooltip = document.getElementById('cursor-tooltip');
        const ttText  = document.getElementById('tooltip-text');
        const blobs   = document.querySelectorAll('.blob');

        // El tooltip sigue al ratón, 22px por debajo del cursor
        document.addEventListener('mousemove', (e) => {
            tooltip.style.left = e.clientX + 'px';
            tooltip.style.top  = (e.clientY + 11) + 'px';
        });

        const ttImg = document.getElementById('tooltip-img');

        blobs.forEach(blob => {
            blob.addEventListener('mouseenter', () => {
                ttText.textContent = blob.dataset.label;
                ttImg.src = blob.dataset.tooltipImg;
                ttImg.classList.toggle('wide', blob.classList.contains('blob--yellow'));
                tooltip.classList.add('visible');
            });
            blob.addEventListener('mouseleave', () => {
                tooltip.classList.remove('visible');
            });
        });
    </script>

</body>
</html>
