<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto — La Plasta</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/blob-yellow.png">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="contacto.css">
</head>
<body class="page-contacto">

    <!-- ── Header ── -->
    <header class="site-nav d-flex align-items-baseline justify-content-between">
        <a href="index.html" class="site-name">La Plasta</a>
        <h2 class="contacto-subtitle text-end">Contacto</h2>
    </header>

    <!-- ── Contenido ── -->
    <main class="contacto-main">
        <div class="container-xl">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <p class="contacto-intro">
                        ¿Tienes una idea, una duda o quieres colaborar con nosotras?
                        Escríbenos y te responderemos lo antes posible.
                    </p>

                    <form action="https://api.web3forms.com/submit" method="POST" class="contacto-form">
                        <input type="hidden" name="access_key" value="4552707b-e9ab-4a2c-90bc-b78e27c1d95e">
                        <input type="hidden" name="redirect" value="https://colectivolaplasta.org/gracias.html">
                        <!-- Honeypot antispam: los bots lo rellenan, los humanos no lo ven -->
                        <input type="checkbox" name="botcheck" class="d-none" style="display:none" tabindex="-1" autocomplete="off">

                        <div class="mb-3">
                            <label for="name" class="form-label">Nombre</label>
                            <input type="text" id="name" name="name" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>

                        <div class="mb-4">
                            <label for="message" class="form-label">Mensaje</label>
                            <textarea id="message" name="message" rows="5" class="form-control" required></textarea>
                        </div>

                        <button type="submit" class="contacto-submit">Enviar</button>
                    </form>

                </div>
            </div>
        </div>
    </main>

    <!-- ── Footer ── -->
    <footer class="site-footer">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-auto">
                    <a href="mailto:info@colectivolaplasta.org">info@colectivolaplasta.org</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
